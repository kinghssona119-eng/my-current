<style>
:root{
  --primary:#0F758A;
  --primary-d:#0B5A6B;
  --primary-l:#E4F1F3;
  --text:#2C3539;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --success:#2E7D32;
  --success-l:#E8F5E9;
  --warning:#ED6C02;
  --warning-l:#FFF3E0;
  --danger:#D32F2F;
  --danger-l:#FDECEA;
  --border:#E4E9EC;
  --muted:#7C8A90;
  --radius:16px;
  --shadow:0 2px 10px rgba(15,117,138,.08);
  --shadow-lg:0 12px 30px rgba(15,117,138,.14);
}
html[data-theme="dark"]{
  --primary:#19A0BA;
  --primary-d:#0F758A;
  --primary-l:#123039;
  --text:#E7EEF0;
  --bg:#0E161B;
  --card:#152029;
  --success:#4CAF50;
  --success-l:#173420;
  --warning:#FFA726;
  --warning-l:#3A2A12;
  --danger:#EF5350;
  --danger-l:#3A1717;
  --border:#243139;
  --muted:#8CA0A8;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 12px 30px rgba(0,0,0,.45);
}
html[data-theme="dark"] body{
  background: radial-gradient(1200px 500px at 100% -10%, #14262d 0%, transparent 60%), var(--bg);
}
html[data-theme="dark"] .bottomnav{ background:#101a20; }
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea{
  background:#0E161B;color:var(--text);border-color:var(--border);
}
html[data-theme="dark"] .photo-box{ background:var(--primary-l); }
html[data-theme="dark"] .login-card{ background:var(--card); color:var(--text); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Cairo',sans-serif;
  background:
    radial-gradient(1200px 500px at 100% -10%, #E4F1F3 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
[dir="ltr"] body{font-family:'Cairo',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button, input, select, textarea{font-family:inherit;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.06);}
.mainArea{display:flex;flex-direction:column;flex:1;min-width:0;}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(135deg,var(--primary) 0%, var(--primary-d) 100%);
  color:#fff;padding:16px 18px calc(16px + var(--wave,0px));
  display:flex;align-items:center;gap:12px;
}
.topbar .back{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;border:none;color:#fff;cursor:pointer;flex-shrink:0;
}
.topbar h1{font-size:17px;font-weight:700;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .sub{font-size:11px;opacity:.85;font-weight:500;margin-top:2px;}
.topbar .actions{display:flex;gap:8px;}
.iconbtn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* ---------- content ---------- */
.content{flex:1;padding:16px 16px 100px;}
.screen{animation:fadeUp .28s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
.section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:20px 4px 10px;display:flex;align-items:center;justify-content:space-between;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],select,textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:15px;color:var(--text);outline:none;transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-l);}
textarea{resize:vertical;min-height:70px;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:13px;border:none;
  font-size:15px;font-weight:800;cursor:pointer;transition:.15s;
}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(15,117,138,.28);}
.btn-primary:active{transform:scale(.98);background:var(--primary-d);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.btn-ghost{background:var(--primary-l);color:var(--primary-d);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:10px;width:auto;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;}
.badge-success{background:var(--success-l);color:var(--success);}
.badge-warning{background:var(--warning-l);color:var(--warning);}
.badge-danger{background:var(--danger-l);color:var(--danger);}
.badge-primary{background:var(--primary-l);color:var(--primary-d);}
.badge-muted{background:#EEF1F2;color:var(--muted);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ic{font-size:44px;margin-bottom:10px;opacity:.5;}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px;}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--primary-l);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:20px;overflow:hidden;}
.li-body{flex:1;min-width:0;}
.li-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;padding:28px;background:linear-gradient(160deg,var(--primary-d) 0%,var(--primary) 55%,#12879c 100%);color:#fff;position:relative;overflow:hidden;}
.login-inner{width:100%;max-width:400px;margin:0 auto;position:relative;z-index:1;}
.login-wrap::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 15% 10%, rgba(255,255,255,.10) 0, transparent 40%),
  radial-gradient(circle at 90% 85%, rgba(255,255,255,.08) 0, transparent 45%);}
.login-logo{width:200px;height:100px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:var(--shadow-lg);position:relative;z-index:1;padding:10px;}
.login-logo svg{width:52px;height:52px;}
.login-brand{text-align:center;font-size:24px;font-weight:800;position:relative;z-index:1;}
.login-brand small{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:4px;}
.login-card{background:#fff;border-radius:22px;padding:26px 22px;margin-top:28px;color:var(--text);box-shadow:var(--shadow-lg);position:relative;z-index:1;}
.lang-switch{position:absolute;top:18px;inset-inline-end:18px;z-index:2;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;}
.demo-roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.chip{padding:6px 10px;border-radius:20px;background:var(--primary-l);color:var(--primary-d);font-size:11px;font-weight:700;cursor:pointer;border:1px solid transparent;}
.chip.active{background:var(--primary);color:#fff;}

/* ---------- bottom nav ---------- */
.bottomnav{position:sticky;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.05);}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:10.5px;font-weight:700;}
.navbtn svg{width:22px;height:22px;}
.navbtn.active{color:var(--primary);}
.navbtn .fab{width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 8px 18px rgba(15,117,138,.4);border:4px solid #fff;}

/* ---------- desktop / windows layout: sidebar instead of phone frame ---------- */
@media(min-width:900px){
  body{padding:24px 16px;}
  #app{
    max-width:1180px;margin:0 auto;min-height:calc(100vh - 48px);
    flex-direction:row;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);
  }
  .mainArea{order:1;min-width:0;flex:1;}
  .content{max-width:820px;margin:0 auto;padding:26px 32px 50px;}
  .topbar{border-radius:0;padding:20px 28px;}
  .bottomnav{
    order:-1;flex:0 0 236px;width:236px;height:auto;flex-direction:column;align-items:stretch;
    justify-content:flex-start;gap:2px;padding:20px 12px;border-top:none;
    border-inline-end:1px solid var(--border);box-shadow:none;background:#fdfefe;
    position:sticky;top:0;align-self:stretch;
  }
  .bottomnav .navbtn{
    flex:0 0 auto;flex-direction:row;justify-content:flex-start;align-items:center;
    gap:12px;padding:11px 14px;border-radius:12px;font-size:13.5px;color:var(--text);
  }
  .bottomnav .navbtn.active{background:var(--primary-l);color:var(--primary-d);}
  .bottomnav .navbtn svg{width:19px;height:19px;flex-shrink:0;}
  .bottomnav .navbtn .fab{margin:0;width:30px;height:30px;border:none;box-shadow:none;border-radius:9px;flex-shrink:0;}
  .stat-grid{grid-template-columns:repeat(4,1fr);}
}
@media(min-width:1150px){
  .content{max-width:900px;}
}

/* ---------- fab scan ---------- */
.scan-box{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:320px;}
#qr-reader{width:100%;}
#qr-reader video{border-radius:16px;}

/* ---------- signature ---------- */
.sig-wrap{border:1.5px dashed var(--border);border-radius:14px;background:#fff;position:relative;}
.sig-wrap canvas{width:100%;height:150px;border-radius:14px;touch-action:none;}
.sig-clear{position:absolute;top:8px;inset-inline-end:8px;background:var(--danger-l);color:var(--danger);border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;}

/* photo capture */
.photo-box{width:100%;aspect-ratio:4/3;border-radius:14px;border:1.5px dashed var(--border);background:var(--primary-l);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;overflow:hidden;position:relative;}
.photo-box img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.photo-box .lbl{font-size:12px;font-weight:700;margin-top:6px;z-index:1;}

/* barcode preview */
.barcode-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
.barcode-code{font-size:13px;font-weight:800;letter-spacing:.5px;margin-top:6px;color:var(--text);}

/* toast */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:700;z-index:200;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;max-width:86%;text-align:center;}
#toast.show{opacity:1;bottom:106px;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,33,.5);z-index:150;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s;}
.modal-bg.show{opacity:1;pointer-events:all;}
.modal{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px;max-height:85vh;overflow:auto;transform:translateY(100%);transition:.25s;}
.modal-bg.show .modal{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
.modal h3{margin:0 0 14px;font-size:17px;}

/* tabs */
.tabs{display:flex;background:var(--primary-l);border-radius:12px;padding:4px;margin-bottom:14px;}
.tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--primary-d);cursor:pointer;}
.tab.active{background:var(--primary);color:#fff;}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;}
.stat .n{font-size:22px;font-weight:800;}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;}
.stat.warn .n{color:var(--warning);}
.stat.danger .n{color:var(--danger);}
.stat.ok .n{color:var(--success);}

/* footer credit */
.credit-footer{text-align:center;padding:18px 12px 14px;color:var(--muted);font-size:11px;line-height:1.9;border-top:1px dashed var(--border);margin-top:22px;}
.credit-footer b{color:var(--primary-d);font-size:11.5px;}
.credit-footer .tel{direction:ltr;display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--primary);}

/* progress / spinner */
.spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:500;}
.loading-screen .spinner{width:32px;height:32px;border:4px solid var(--primary-l);border-top-color:var(--primary);}

.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:13px;padding:10px 14px;margin-bottom:14px;}
.searchbar input{border:none;padding:0;flex:1;}
.searchbar input:focus{box-shadow:none;}
.searchbar svg{color:var(--muted);flex-shrink:0;}

.hidden{display:none !important;}
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>

<script>

/* Register the global error safety-net FIRST, before anything else runs, so
   it can catch errors thrown during initial script evaluation too — not
   just errors inside boot(). Without this, an early error anywhere below
   would silently leave the loading screen (or a blank page) forever. */
function showFatalError(msg){
  const ls = document.getElementById('loadingScreen');
  if(ls){
    ls.innerHTML = `<div style="max-width:320px;text-align:center;padding:20px;">
      <div style="font-size:34px;margin-bottom:10px;">⚠️</div>
      <div style="font-weight:800;color:#D32F2F;margin-bottom:8px;">تعذّر تشغيل التطبيق</div>
      <div style="font-size:12.5px;color:#7C8A90;line-height:1.7;">${msg}<br><br>جرّب فتح الملف عبر رابط ويب (استضافة) بدلاً من فتحه مباشرة من مدير الملفات، أو افتحه في متصفح Chrome كامل.</div>
    </div>`;
    ls.classList.remove('hidden');
  }
}
window.addEventListener('error', function(e){
  console.error('Global error:', e.error || e.message);
  const appEl = document.getElementById('app');
  if(appEl && appEl.classList.contains('hidden')){
    showFatalError((e.message||'').toString());
  }
});

/* ---------------- Firebase config ----------------
   Replace with your own project's config (Console → Project settings).
   Enable: Authentication (Email/Password), Firestore, Storage.
--------------------------------------------------------------------------*/
const firebaseConfig = {
  apiKey: "AIzaSyDLcfIkcL6nEGNoGKHTTwbYB8SJJ3LISU0",
  authDomain: "mu-current.firebaseapp.com",
  projectId: "mu-current",
  storageBucket: "mu-current.firebasestorage.app",
  messagingSenderId: "117014543923",
  appId: "1:117014543923:web:6a86ac8f77d04d93852d46"
};
let fbReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  fbReady = true;
}catch(e){ console.warn("Firebase not configured yet:", e); }
const auth = fbReady ? firebase.auth() : null;
const db   = fbReady ? firebase.firestore() : null;
const storage = fbReady ? firebase.storage() : null;

/* Secondary Firebase app instance — used only to create new login accounts
   without disturbing the currently signed-in admin's session (calling
   createUserWithEmailAndPassword on the primary auth would sign the admin
   out and log in as the new user instead). */
let secondaryApp = null;
function getSecondaryAuth(){
  if(!fbReady) return null;
  try{
    secondaryApp = firebase.app("Secondary");
  }catch(e){
    secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary");
  }

/* ---------------- Live Firestore sync (replaces the old local-only demo data) ---------------- */
let unsubItems = null, unsubTransfers = null, unsubUsers = null, unsubHandovers = null;
function startLiveSync(){
  if(!fbReady || !db) { seedDemo(); return; }
  stopLiveSync();
  unsubItems = db.collection('items').orderBy('date','desc').onSnapshot(snap=>{
    state.items = snap.docs.map(d=>d.data());
    if(['dashboard','items','itemDetail','alerts','reports'].includes(state.route)) render();
  }, err=>console.warn('items sync error', err));
  unsubTransfers = db.collection('transfers').orderBy('date','desc').onSnapshot(snap=>{
    state.transfers = snap.docs.map(d=>d.data());
    if(['dashboard','transfers','reports'].includes(state.route)) render();
  }, err=>console.warn('transfers sync error', err));
  unsubUsers = db.collection('users').onSnapshot(snap=>{
    state.users = snap.docs.map(d=>({uid:d.id, ...d.data()}));
    if(state.route==='users') render();
  }, err=>console.warn('users sync error', err));
  unsubHandovers = db.collection('handovers').orderBy('date','desc').onSnapshot(snap=>{
    state.handovers = snap.docs.map(d=>d.data());
    if(['handover','handoverDoc'].includes(state.route)) render();
  }, err=>console.warn('handovers sync error', err));
}
function stopLiveSync(){
  if(unsubItems){ unsubItems(); unsubItems=null; }
  if(unsubTransfers){ unsubTransfers(); unsubTransfers=null; }
  if(unsubUsers){ unsubUsers(); unsubUsers=null; }
  if(unsubHandovers){ unsubHandovers(); unsubHandovers=null; }
}

/* Users can log in with either a plain username (mapped below to a real
   account) or a real email address typed as-is. Add more aliases here as
   you create more accounts, e.g. "storekeeper1": "someone@gmail.com". */
const USERNAME_DOMAIN = "mu-current.local";
const USERNAME_ALIASES = {
  "admin": "hasan7ghaleb@gmail.com"
};
function usernameToEmail(u){
  const v = u.trim().toLowerCase();
  if(USERNAME_ALIASES[v]) return USERNAME_ALIASES[v];
  if(v.includes('@')) return v;
  return v.replace(/\s+/g,'') + "@" + USERNAME_DOMAIN;
}

async function realLogin(username, pass){
  try{
    const email = usernameToEmail(username);
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const snap = await db.collection('users').doc(cred.user.uid).get();
    const data = snap.exists ? snap.data() : {name:email, role:"STOREKEEPER", city:state.cities[0]};
    state.user = {uid:cred.user.uid, ...data};
    startLiveSync();
    go('dashboard');
  }catch(e){
    toast(LANG==='ar' ? "فشل تسجيل الدخول: تحقق من البيانات" : "Login failed: check credentials");
  }
}
function logout(){
  state.user = null;
  stopLiveSync();
  state.items = []; state.transfers = []; state.users = [];
  if(fbReady && auth) auth.signOut().catch(()=>{});
  go('login');
}

let sigPad;
function onCityChange(){
  const city = document.getElementById('fCity').value;

function bindAddItem(){
  onCityChange();
  const canvas = document.getElementById('sigCanvas');
  function resizeCanvas(){
    const ratio = Math.max(window.devicePixelRatio||1,1);
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    canvas.getContext('2d').scale(ratio, ratio);
  }
  resizeCanvas();
  sigPad = new SignaturePad(canvas, {penColor:'#0F758A'});

  const photoInput = document.getElementById('itemPhotoInput');
  let photoData = "";
  photoInput.onchange = ()=>{
    const f = photoInput.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = e=>{
      photoData = e.target.result;
      const img = document.getElementById('photoPreview');
      img.src = photoData; img.classList.remove('hidden');
      document.getElementById('photoPlaceholder').classList.add('hidden');
    };
    reader.readAsDataURL(f);
  };

  document.getElementById('saveItemBtn').onclick = async ()=>{
    const name = document.getElementById('fName').value.trim();
    const unit = document.getElementById('fUnit').value;
    const qty = parseFloat(document.getElementById('fQty').value || 0);
    const city = document.getElementById('fCity').value;
    const wh = document.getElementById('fWh').value;
    const supplier = document.getElementById('fSupplier').value.trim();
    if(!name || !qty || !supplier){ toast(t('common_required')); return; }

    const id = genBarcodeId(city, wh, 'TMP');
    const item = {
      id, name, unit, qty, minQty: Math.max(5, Math.round(qty*0.2)),
      city, warehouse: wh, shelf: "", supplier,
      enteredBy: state.user.name, date: Date.now(),
      photo: photoData, signature: sigPad.isEmpty() ? "" : sigPad.toDataURL()
    };
    await saveItem(item);
    toast(t('item_saved'));
    renderBarcodeResult(item);
  };
}
function renderBarcodeResult(item){
  document.getElementById('barcodeResult').innerHTML = `
    <div class="barcode-card">
      <svg id="bcSvg" style="width:100%;max-width:280px;height:auto;"></svg>
      <div class="barcode-code mono">${item.id}</div>
      <div class="row" style="margin-top:12px;">
        <button class="btn btn-outline btn-sm" onclick="go('putaway',{id:'${item.id}'})">🗂️ ${t('putaway_title')}</button>
        <button class="btn btn-primary btn-sm" onclick="printBarcode('${item.id}')">🖨️ ${t('item_print')}</button>
      </div>
    </div>`;
  drawBarcode('bcSvg', item.id);
}
function drawBarcode(svgId, code){
  const el = document.getElementById(svgId);
  if(!el) return false;
  if(window.JsBarcode){
    try{
      JsBarcode(el, code, {format:"CODE128", height:50, fontSize:12, margin:6, displayValue:false});
      return true;
    }catch(e){ console.warn('barcode render failed', e); }
  }
  // Fallback: library unavailable (e.g. offline) — show the code as text so it's still usable.
  el.outerHTML = `<div style="padding:16px;text-align:center;font-weight:800;letter-spacing:2px;border:2px dashed var(--border);border-radius:10px;" class="mono">${code}</div>`;
  return false;
}
function printBarcode(id){
  const item = state.items.find(i=>i.id===id);
  if(!item) return;
  const w = window.open('', '_blank', 'width=420,height=500');
  if(!w){ toast(LANG==='ar'?"يرجى السماح بالنوافذ المنبثقة للطباعة":"Please allow pop-ups to print"); return; }
  w.document.write(`
    <html dir="ltr"><head><meta charset="utf-8"><title>${item.id}</title>
    <style>
      @page{ size:60mm 40mm; margin:2mm; }
      body{ font-family:Arial,sans-serif; text-align:center; margin:0; padding:6px; }
      svg{ width:100%; height:auto; }
      .code{ font-size:11px; font-weight:bold; letter-spacing:1px; margin-top:2px; }
      .name{ font-size:10px; margin-bottom:4px; }
    </style></head>
    <body>
      <div class="name">${item.name}</div>
      <svg id="pbc"></svg>
      <div class="code">${item.id}</div>
      <script src="https://unpkg.com/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
      <script>
        window.onload = function(){
          try{ JsBarcode("#pbc", ${JSON.stringify(item.id)}, {format:"CODE128", height:40, fontSize:0, margin:4}); }catch(e){}
          setTimeout(function(){ window.print(); }, 300);
        };
      <\/script>
    </body></html>
  `);
  w.document.close();
}

/* ---------- Scanner (html5-qrcode) ---------- */
let html5Qr = null;
function startScanner(callbackName){
  if(!window.Html5Qrcode){ toast(LANG==='ar'?"مكتبة المسح غير متاحة":"Scanner library unavailable"); return; }
  if(!window.isSecureContext){
    toast(LANG==='ar'
      ? "الكاميرا تعمل فقط على رابط https:// آمن — افتح التطبيق من رابط استضافة حقيقي (Firebase Hosting) لتفعيلها"
      : "Camera only works over a secure https:// origin — open the app from a real hosted link to enable it");
    return;
  }
  stopScanner();
  html5Qr = new Html5Qrcode("qr-reader");
  html5Qr.start({facingMode:"environment"}, {fps:10, qrbox:220},
    (decodedText)=>{ window[callbackName](decodedText); },
    ()=>{}
  ).catch(()=>{ toast(LANG==='ar'?"تعذر الوصول إلى الكاميرا — تأكد من منح الإذن":"Camera access failed — check permission"); });
}
function stopScanner(){
  if(html5Qr){ html5Qr.stop().then(()=>html5Qr.clear()).catch(()=>{}); html5Qr=null; }
}

function initHoSigPad(canvasId){

  canvas.getContext('2d').scale(ratio, ratio);
  return new SignaturePad(canvas, {penColor:'#0F758A'});
}

async function exportHandoverExcel(id){
  const ho = state.handovers.find(h=>h.id===id);
  if(!ho) return;
  const isIssue = ho.type==='issue';
  if(!window.ExcelJS){ toast(LANG==='ar'?"مكتبة التصدير غير متاحة":"Export library unavailable"); return; }
  try{
    const wb = new ExcelJS.Workbook();
    const sheet = wb.addWorksheet(t(isIssue?'handover_doc_issue':'handover_doc_return'), {views:[{rightToLeft: LANG==='ar'}]});
    const hasPhotos = ho.items.some(it=>{
      const inv = state.items.find(x=>x.name===it.name);
      return inv && inv.photo;
    });
    const cols = hasPhotos ? 6 : 5;
    const lastCol = sheet.getColumn(cols).letter;

    try{
      const imgId = wb.addImage({ base64: LOGO_URI, extension: 'png' });
      sheet.addImage(imgId, { tl:{col:0, row:0}, ext:{width:140, height:70} });
    }catch(e){}
    sheet.mergeCells(`A1:${lastCol}4`);
    sheet.getRow(5).height = 6;

    sheet.mergeCells(`A6:${lastCol}6`);
    const title = sheet.getCell('A6');
    title.value = `${t(isIssue?'handover_doc_issue':'handover_doc_return')} — My Current Co. Ltd — شركة ماي كيرنت`;
    title.font = { bold:true, size:14, color:{argb:'FFFFFFFF'} };
    title.alignment = { vertical:'middle', horizontal: LANG==='ar'?'right':'left' };
    sheet.getRow(6).height = 28;
    for(let c=1;c<=cols;c++){ sheet.getCell(6,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF12283B'} }; }

    sheet.mergeCells(`A7:${lastCol}7`);
    const info = sheet.getCell('A7');
    info.value = `${t('handover_date')}: ${new Date(ho.date).toLocaleDateString('ar-SA')}   |   ${t(isIssue?'handover_recipient':'handover_deliverer')}: ${ho.personName}   |   ${t('handover_phone')}: ${ho.personPhone||'-'}   |   ${t('handover_keeper')}: ${ho.by}`;
    info.font = { size:10, color:{argb:'FF7C8A90'} };
    info.alignment = { horizontal: LANG==='ar'?'right':'left' };
    sheet.getRow(8).height = 6;

    const headerIdx = 9;
    const headers = hasPhotos
      ? ['م', t('handover_item_name'), t('handover_item_qty'), t('handover_item_unit'), t('handover_item_note'), LANG==='ar'?'صورة':'Photo']
      : ['م', t('handover_item_name'), t('handover_item_qty'), t('handover_item_unit'), t('handover_item_note')];
    const headerRow = sheet.getRow(headerIdx);
    headers.forEach((h,i)=>{
      const cell = headerRow.getCell(i+1);
      cell.value = h;
      cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1F6F4B'} };
      cell.alignment = { vertical:'middle', horizontal:'center' };
    });
    headerRow.height = 22;

    ho.items.forEach((it,ri)=>{
      const rowIdx = headerIdx+1+ri;
      const row = sheet.getRow(rowIdx);
      const vals = [ri+1, it.name, it.qty, it.unit, it.note||'-'];
      vals.forEach((v,ci)=>{
        const cell = row.getCell(ci+1);
        cell.value = v;
        cell.alignment = { vertical:'middle', horizontal: ci===1 ? (LANG==='ar'?'right':'left') : 'center' };
        cell.border = { bottom:{style:'thin', color:{argb:'FFEFF2F3'}} };
        if(ri%2===1){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF3F8F9'} }; }
      });
      if(hasPhotos){
        row.height = 46;
        const inv = state.items.find(x=>x.name===it.name);
        if(inv && inv.photo){
          try{
            const ext = inv.photo.includes('image/png') ? 'png' : 'jpeg';
            const imgId2 = wb.addImage({ base64: inv.photo, extension: ext });
            sheet.addImage(imgId2, { tl:{col:5, row:rowIdx-1}, ext:{width:44, height:40} });
          }catch(e){}
        }
      }
    });

    sheet.getColumn(1).width = 6;
    sheet.getColumn(2).width = 28;
    sheet.getColumn(3).width = 10;
    sheet.getColumn(4).width = 12;
    sheet.getColumn(5).width = 24;
    if(hasPhotos) sheet.getColumn(6).width = 10;
    sheet.views = [{ state:'frozen', ySplit: headerIdx, rightToLeft: LANG==='ar' }];

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${ho.id}_${Date.now()}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    console.warn('handover excel export failed', e);
    toast(LANG==='ar'?"تعذّر التصدير":"Export failed");
  }
}

function bindStocktake(){}
function stocktakeScanned(code){
  const norm = (code||'').trim().toUpperCase();
  const it = state.items.find(i=>i.id.toUpperCase()===norm);
  if(!it) return;
  stocktakeScans[it.id] = (stocktakeScans[it.id]||0) + 1;
  document.getElementById('stCount').textContent = Object.keys(stocktakeScans).length;
  document.getElementById('stList').innerHTML = Object.entries(stocktakeScans).map(([id,actual])=>{
    const item = state.items.find(i=>i.id===id);
    const diff = actual - item.qty;
    return `<div class="list-item">
      <div class="thumb">📦</div>
      <div class="li-body"><div class="li-title">${item.name}</div><div class="li-sub">${t('stock_expected')}: ${item.qty} · ${t('stock_actual')}: ${actual}</div></div>
      <div class="badge ${diff===0?'badge-success':'badge-danger'}">${diff>0?'+':''}${diff}</div>
    </div>`;
  }).join('');
}
function exportStockReport(){
  const rows = Object.entries(stocktakeScans).map(([id,actual])=>{
    const item = state.items.find(i=>i.id===id) || {};
    return {[LANG==='ar'?'الكود':'Code']:id, [LANG==='ar'?'الاسم':'Name']:item.name, [t('stock_expected')]:item.qty, [t('stock_actual')]:actual, [LANG==='ar'?'الفرق':'Diff']:(actual-(item.qty||0))};
  });
  if(!rows.length){ toast(t('common_none')); return; }
  exportExcel(rows, "stocktake_report", t('stock_title'));
}

    </div>
    <div style="font-size:12px;color:var(--muted);background:var(--warning-l);border-radius:10px;padding:10px;margin-bottom:16px;">
      ${LANG==='ar'?'ملاحظة: حساب الدخول نفسه بـ Firebase Authentication يبقى موجود ما لم تحذفه يدوياً من الكونسول — هذا يمنعه من الدخول للبيانات فقط.':'Note: the login account itself in Firebase Authentication still exists unless you delete it manually from the console — this just revokes their in-app data access.'}
    </div>
    <div class="row">
      <button class="btn btn-outline" onclick="closeModal()">${t('common_cancel')}</button>
      <button class="btn btn-danger" onclick="doDeleteUser('${uid}')">🗑️ ${LANG==='ar'?'حذف':'Delete'}</button>
    </div>
  `);
}
async function doDeleteUser(uid){
  state.users = state.users.filter(u=>u.uid!==uid);
  if(fbReady && db){
    try{ await db.collection('users').doc(uid).delete(); }catch(e){ console.warn(e); }
  }
  closeModal();
  toast(LANG==='ar'?'تم حذف المستخدم':'User deleted');
  render();
}
function openAddUserModal(){
  const roleOpts = ROLES.filter(r=> can('manageAdmins') || r!=='ADMIN').map(r=>`<option value="${r}">${t('role_'+r)}</option>`).join('');
  openModal(`
    <h3>${t('users_new')}</h3>
    <div class="field"><label>${LANG==='ar'?'الاسم':'Name'}</label><input type="text" id="nuName"></div>
    <div class="field"><label>${t('users_role')}</label><select id="nuRole">${roleOpts}</select></div>
    <div class="field"><label>${t('item_city')}</label><select id="nuCity">${state.cities.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field">
      <label>${t('users_username')}</label>
      <input type="text" id="nuUsername" placeholder="${LANG==='ar'?'مثال: sara.storekeeper':'e.g. sara.storekeeper'}" autocapitalize="off" autocorrect="off">
      <div class="hint">${t('users_username_hint')}</div>
    </div>
    <div class="field"><label>${t('users_password')}</label><input type="password" id="nuPassword" placeholder="${LANG==='ar'?'6 أحرف على الأقل':'at least 6 characters'}"></div>
    <div class="row">
      <button class="btn btn-outline" onclick="closeModal()">${t('common_cancel')}</button>
      <button class="btn btn-primary" id="nuSaveBtn" onclick="addUser()">${t('common_save')}</button>
    </div>
  `);
}
async function addUser(){
  const name = document.getElementById('nuName').value.trim();
  const role = document.getElementById('nuRole').value;
  const city = document.getElementById('nuCity').value;
  const username = document.getElementById('nuUsername').value.trim();
  const password = document.getElementById('nuPassword').value;
  if(!name || !username){ toast(t('common_required')); return; }

  if(fbReady && db){
    if(!password || password.length < 6){
      toast(LANG==='ar' ? "كلمة المرور يجب أن تكون 6 أحرف على الأقل" : "Password must be at least 6 characters");
      return;
    }
    const email = usernameToEmail(username);
    const btn = document.getElementById('nuSaveBtn');
    if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span>`; }
    try{
      const secAuth = getSecondaryAuth();
      const cred = await secAuth.createUserWithEmailAndPassword(email, password);
      const uid = cred.user.uid;
      await db.collection('users').doc(uid).set({name, role, city});
      await secAuth.signOut();
      state.users.unshift({uid, name, role, city});
      closeModal();
      toast(LANG==='ar' ? `تم إنشاء الحساب — اسم المستخدم: ${username}` : `Account created — username: ${username}`);
      render();
    }catch(e){
      let msg = e && e.message ? e.message : String(e);
      if(e && e.code === 'auth/email-already-in-use') msg = LANG==='ar' ? "اسم المستخدم هذا مستخدم بالفعل" : "This username is already taken";
      if(e && e.code === 'auth/weak-password') msg = LANG==='ar' ? "كلمة المرور ضعيفة جداً" : "Password is too weak";
      toast(msg);
      if(btn){ btn.disabled = false; btn.textContent = t('common_save'); }
    }
  } else {
    // Demo mode: no real backend configured, just keep it local
    state.users.unshift({uid:'u-'+Date.now(), name, role, city});
    closeModal();
    toast(t('common_save'));
    render();
  }
}

/* Styled Excel export: company header row with logo, teal branded title bar,
   bold header row, borders, auto column widths. Falls back to a plain XLSX
   export if the ExcelJS library didn't load (e.g. offline). */
async function exportExcel(rows, filename, title){
  if(!rows || !rows.length){ toast(t('common_none')); return; }
  if(window.ExcelJS){
    try{
      const wb = new ExcelJS.Workbook();
      wb.creator = "My Current Warehouse";
      const sheet = wb.addWorksheet(title || filename, {
        views:[{rightToLeft: LANG==='ar'}]
      });
      const cols = Object.keys(rows[0]);
      const colCount = cols.length;
      const lastColLetter = sheet.getColumn(colCount).letter;

      // Logo image
      try{
        const imgId = wb.addImage({ base64: LOGO_URI, extension: 'png' });
        sheet.addImage(imgId, { tl:{col:0, row:0}, ext:{width:150, height:75} });
      }catch(e){ console.warn('logo embed skipped', e); }

      sheet.mergeCells(`A1:${lastColLetter}4`);
      sheet.getRow(5).height = 6;

      // Title bar
      sheet.mergeCells(`A6:${lastColLetter}6`);
      const titleCell = sheet.getCell('A6');
      titleCell.value = (title || filename) + "  —  My Current Co. Ltd — شركة ماي كيرنت";
      titleCell.font = { bold:true, size:14, color:{argb:'FFFFFFFF'} };
      titleCell.alignment = { vertical:'middle', horizontal: LANG==='ar' ? 'right' : 'left' };
      sheet.getRow(6).height = 30;
      for(let c=1;c<=colCount;c++){ sheet.getCell(6,c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF0F758A'} }; }

      sheet.mergeCells(`A7:${lastColLetter}7`);
      const dateCell = sheet.getCell('A7');
      dateCell.value = (LANG==='ar' ? 'تاريخ التصدير: ' : 'Exported: ') + new Date().toLocaleString(LANG==='ar'?'ar-SA':'en-GB');
      dateCell.font = { italic:true, size:10, color:{argb:'FF7C8A90'} };
      dateCell.alignment = { horizontal: LANG==='ar' ? 'right' : 'left' };
      sheet.getRow(8).height = 6;

      // Header row
      const headerRowIdx = 9;
      const headerRow = sheet.getRow(headerRowIdx);
      cols.forEach((c,i)=>{
        const cell = headerRow.getCell(i+1);
        cell.value = c;
        cell.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF0B5A6B'} };
        cell.alignment = { vertical:'middle', horizontal:'center' };
        cell.border = { bottom:{style:'thin', color:{argb:'FFDDDDDD'}} };
      });
      headerRow.height = 24;

      // Data rows
      rows.forEach((r,ri)=>{
        const row = sheet.getRow(headerRowIdx+1+ri);
        cols.forEach((c,ci)=>{
          const cell = row.getCell(ci+1);
          cell.value = r[c] ?? '';
          cell.alignment = { vertical:'middle', horizontal: LANG==='ar' ? 'right' : 'left' };
          cell.border = { bottom:{style:'thin', color:{argb:'FFEFF2F3'}} };
          if(ri % 2 === 1){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF3F8F9'} }; }
        });
      });

      // Column widths
      cols.forEach((c,i)=>{
        let maxLen = String(c).length;
        rows.forEach(r=>{ const v = String(r[c] ?? ''); if(v.length>maxLen) maxLen = v.length; });
        sheet.getColumn(i+1).width = Math.min(Math.max(maxLen+4, 12), 40);
      });

      sheet.autoFilter = { from:{row:headerRowIdx, column:1}, to:{row:headerRowIdx, column:colCount} };
      sheet.views = [{ state:'frozen', ySplit: headerRowIdx, rightToLeft: LANG==='ar' }];

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${filename}_${Date.now()}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return;
    }catch(e){
      console.warn('ExcelJS export failed, falling back:', e);
    }
  }
  // Fallback: plain export
  if(window.XLSX){
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb2 = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb2, ws, "Sheet1");
    XLSX.writeFile(wb2, `${filename}_${Date.now()}.xlsx`);
  } else {
    toast(LANG==='ar' ? "تعذّر تصدير الملف — تحقق من الاتصال بالإنترنت" : "Couldn't export — check your internet connection");
  }
}

/* ================= boot ================= */
window.addEventListener('online', ()=>{ state.online=true; render(); });
window.addEventListener('offline', ()=>{ state.online=false; render(); });

function boot(){
  try{
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    if(fbReady && auth){
      auth.onAuthStateChanged(async (fbUser)=>{
        try{
          if(fbUser){
            try{
              const snap = await db.collection('users').doc(fbUser.uid).get();
              state.user = {uid:fbUser.uid, ...(snap.exists?snap.data():{name:fbUser.email, role:'STOREKEEPER', city:state.cities[0]})};
            }catch(e){ state.user = {uid:fbUser.uid, name:fbUser.email, role:'STOREKEEPER', city:state.cities[0]}; }
            startLiveSync();
          } else {
            state.user = null;
            stopLiveSync();
          }
          render();
        }catch(err){ showFatalError((err.message||'').toString()); }
      });
    } else {
      seedDemo();
      render();
    }
  }catch(err){
    showFatalError((err.message||'').toString());
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
